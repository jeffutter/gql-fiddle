# Live sync worker — standalone Cloudflare Worker with Durable Object.
# Deploy: npx wrangler deploy --config live-sync/wrangler.toml
# Dev:   npx wrangler dev --config live-sync/wrangler.toml

name = "gql-fiddle-live-sync"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Fixed port so LIVE_SYNC_URL=http://localhost:8789 in the main project's
# .dev.vars stays correct without passing --port by hand.
[dev]
port = 8789

# Durable Object class — one instance per session
[durable_objects]
bindings = [{ name = "LiveSession", class_name = "LiveSession" }]

# Migrations — track DO class versions.
# Free tier requires SQLite-backed Durable Objects (new_sqlite_classes).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveSession"]

# Routing: configure via Cloudflare Dashboard or API.
# Wrangler CLI: wrangler routes list --config live-sync/wrangler.toml
# To add a route via CLI:
#   wrangler routes create --pattern "live-sync.gqlfiddle.dev/*" --zone-name "gqlfiddle.dev"
# (requires zone name from Cloudflare dashboard)
#
# Alternatively, use `wrangler deploy --route "live-sync.gqlfiddle.dev/*"`
# when deploying from CI if you prefer automated routing.

# D1 database — same instance as the main Pages project.
# Use the same database_id so both services share the live_sessions table.
# Local dev: the `dev` script passes --persist-to ../.wrangler/state so this
# worker reads/writes the same local SQLite state as `wrangler pages dev`
# (run from the repo root, which persists to .wrangler/state by default).
[[d1_databases]]
binding = "DB"
database_name = "gql-fiddle-db"
database_id = "b52a7c08-99dd-41b0-9c5f-0baf5e796362"
